<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbiterm</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="terminal.css">
<link rel="stylesheet" href="mur47.css">
<link rel="stylesheet" href="hk416.css">
<link rel="stylesheet" href="env.css">
</head>
<body>
<header id="hud">
  <span id="dot"></span>
  <b id="title">terminal</b>
  <!-- In a linked worktree (the Mac's WorktreeChipView): "⎇ vega │ +42 −7"; a click shows its changes in Source Control. -->
  <button id="wt" type="button" hidden></button>
  <!-- The Claude account of this pane, with two or more accounts (the Mac's AccountChip): its initial, name and what is left; a click opens the menu. -->
  <button id="acct" type="button" hidden aria-haspopup="menu"></button>
  <!-- The status, why it waits when it does, and for how long it's been so (the Mac's status pill). -->
  <span id="status"><span class="lbl"></span><span class="why"></span><span class="t"></span></span>
  <span id="where"></span>
  <!-- The tool call the AI is on, what it's doing and for how long (the Mac HUD's "▸ Bash …"). -->
  <span id="action" hidden><b class="name"></b><span class="label"></span><i class="dur"></i></span>
  <!-- The AI session in it (Claude, Codex, Antigravity): its context and today's counts, as each tab's chip on the Mac. -->
  <span id="ctx" hidden><i>ctx</i><span class="bar"><span></span></span><span class="n"></span><span class="s"></span></span>
  <span id="model" hidden></span>
  <span id="cost" hidden></span>
  <span id="counts" hidden></span>
  <span id="spark" hidden><svg viewBox="0 0 96 18" preserveAspectRatio="none" aria-hidden="true"></svg></span>
  <span id="copied" hidden></span>
  <button id="copyreply" class="icon" type="button" hidden title="Copy the AI's last reply, all of it"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="5.5" y="5" width="8" height="9" rx="1"/><path d="M3 11.5V3a1 1 0 0 1 1-1h6.5"/></svg></button>
  <button id="pin" class="icon" type="button" hidden><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M5.8 1.8h4.4l-.7 4.4 2.7 2.5H3.8l2.7-2.5zM8 8.7v5.6"/></svg></button>
  <!-- The worktree's next step and ▾ for everything (the Mac's WorktreeShipButton): Create PR, Merge PR, Delete worktree. -->
  <span id="ship" hidden><button id="shipMain" type="button"></button><button id="shipMore" type="button" aria-haspopup="menu" title="More for this worktree"></button></span>
  <span id="announce" aria-live="polite"></span>
  <button id="star" type="button" hidden><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg></button>
  <button id="end" type="button" title="End this terminal">end</button>
</header>
<!-- The limit note, the 5% note and the quiet note after a switch (the Mac's AccountNoteBar); each button is the user's click. -->
<div id="acctnote" hidden></div>
<main id="term"></main>
<div id="veil" hidden></div>
<!-- Find in the terminal (the right-click menu's Find…, Ctrl+Shift+F, F3): the Mac's find bar over its terminal. -->
<div id="find" hidden>
  <input id="find-q" type="text" spellcheck="false" autocomplete="off" placeholder="Find" aria-label="Find in the terminal">
  <span id="find-n" aria-live="polite"></span>
  <button id="find-prev" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3.5 10l4.5-4.5 4.5 4.5"/></svg></button>
  <button id="find-next" type="button" title="Next match (Enter)" aria-label="Next match"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3.5 6l4.5 4.5 4.5-4.5"/></svg></button>
  <button id="find-close" type="button" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
</div>
<!-- A neon theme's glow on the terminal's canvas (themes.js turns it on): the text's own colours, blurred and screened
     over it, the dark background left as it is. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="atl-neon" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
    <feComponentTransfer in="blur" result="bright">
      <feFuncR type="gamma" amplitude="1.7" exponent="2"/><feFuncG type="gamma" amplitude="1.7" exponent="2"/><feFuncB type="gamma" amplitude="1.7" exponent="2"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="bright" mode="screen"/>
  </filter>
</svg>
<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
<script src="../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
<script src="../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
<script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
<script src="../src/shellquote.js"></script>
<script src="terminal.js"></script>
<!-- The env button and its view (env.js, the Mac's EnvView.swift). -->
<script src="env.js"></script>
</body>
</html>
